server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las imágenes se suben hasta 5 MB.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://back:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
