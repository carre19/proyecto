# Configuración de nginx para PRODUCCIÓN (HTTPS). Sirve el front, lleva /api al back y atiende a la plataforma y a todos los
# subdominios de los boliches (server_name _). Los certificados (de comodín, *.dominio) se montan en /etc/nginx/certs:
# fullchain.pem y privkey.pem. Ver docs/DESPLIEGUE.md.
server {
    listen 80 default_server;
    server_name _;
    # Para renovar certificados con certbot (desafío HTTP del dominio principal).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Las imágenes se suben hasta 5 MB.
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://back:3000;
        proxy_set_header Host $host;
        # El back usa la dirección real (TRUST_PROXY=1) para limitar intentos por persona.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con huella (JS y CSS compilados) se guardan en el navegador; el index.html no.
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
