services:
  db:
    image: postgres:16-alpine
    container_name: eventos-db
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos
    volumes:
      - db_data:/var/lib/postgresql/data
      # Postgres ejecuta los .sql en orden alfabético (01_, 02_, ...) solo si el volumen está vacío
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventos_net
    restart: unless-stopped

  back:
    build: .
    container_name: eventos-back
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: eventos
      DB_PASSWORD: eventos
      DB_NAME: eventos
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eventos_net
    restart: unless-stopped

  front:
    build: ./frontend
    container_name: eventos-front
    ports:
      - "8081:80"
    depends_on:
      - back
    networks:
      - eventos_net
    restart: unless-stopped

networks:
  eventos_net:
    driver: bridge

volumes:
  db_data:
