# Demostración y desarrollo con Docker: base con datos de ejemplo + back + front. NO es para producción (ver deploy/ y docs/DESPLIEGUE.md).
#   docker compose up -d --build       -> front en http://localhost:8081, back en http://localhost:3000
# La base se crea sola la primera vez con el esquema (00_*) y los datos de ejemplo (01_*); las cuentas demo están en el README.
services:
  db:
    image: postgres:16-alpine
    container_name: plataforma-db
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      POSTGRES_DB: plataforma
    volumes:
      - db_data:/var/lib/postgresql/data
      # Postgres ejecuta estos archivos, en orden alfabético, solo cuando el volumen está vacío.
      - ./database/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./database/00_schema_fase2.sql:/docker-entrypoint-initdb.d/00_schema_fase2.sql:ro
      - ./database/00_schema_fase3.sql:/docker-entrypoint-initdb.d/00_schema_fase3.sql:ro
      - ./database/00_schema_fase4.sql:/docker-entrypoint-initdb.d/00_schema_fase4.sql:ro
      - ./database/00_schema_fase5.sql:/docker-entrypoint-initdb.d/00_schema_fase5.sql:ro
      - ./database/00_schema_fase6.sql:/docker-entrypoint-initdb.d/00_schema_fase6.sql:ro
      - ./database/01_datos_prueba.sql:/docker-entrypoint-initdb.d/01_datos_prueba.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    build: .
    container_name: plataforma-back
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: plataforma
      DB_PASSWORD: plataforma
      DB_NAME: plataforma
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: http://localhost:8081
      PAGOS_WEBHOOK_SECRET: ${PAGOS_WEBHOOK_SECRET:-}
      TRUST_PROXY: "1"
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  front:
    build: ./frontend
    container_name: plataforma-front
    ports:
      - "8081:80"
    depends_on:
      - back
    restart: unless-stopped

volumes:
  db_data:
  uploads:
